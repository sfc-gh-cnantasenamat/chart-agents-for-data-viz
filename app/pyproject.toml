[project]
name = "chartify"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "streamlit[snowflake]==1.57.0",
    "pandas==2.3.3",
    "numpy==2.3.5",
    "snowflake-connector-python==4.7.1",
    "Pillow==12.0.0",
]

[project.optional-dependencies]
test = ["pyarrow==18.1.0", "PyYAML>=6,<7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["chart_agent", "chart_eval", "chart_style"]
